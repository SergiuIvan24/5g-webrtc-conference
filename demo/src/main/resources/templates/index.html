<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Conferință 5G WebRTC</title>
    <!-- Am adăugat /js/ aici -->
    <script src="/js/jssip.bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 50px; background-color: #f8f9fa; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #btn-call { background-color: #28a745; color: white; }
        #btn-hangup { background-color: #dc3545; color: white; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; box-shadow: none; }
        #status { margin-top: 20px; font-weight: bold; color: #555; font-size: 1.2em; }

        /* Design pentru Dashboard-ul de Monitorizare */
        #dashboard-wrapper { margin: 50px auto; width: 85%; max-width: 1000px; text-align: left; }
        h2 { color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 10px; font-size: 24px; }
        table { width: 100%; border-collapse: collapse; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #0056b3; color: white; font-weight: normal; }
        tr:hover { background-color: #f4f6f8; }
        .empty-message { text-align: center; color: #888; font-style: italic; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<h1>Interfață Conferință WebRTC</h1>

<!-- Am adăugat selectorul de cameră -->
<div style="margin-bottom: 20px;">
    <label for="room-input" style="font-weight: bold; font-size: 18px;">Sala de conferință: </label>
    <input type="text" id="room-input" value="3000" style="padding: 10px; font-size: 18px; border-radius: 5px; border: 1px solid #ccc; width: 120px; text-align: center;">
</div>

<button id="btn-call" onclick="makeCall()">📞 Intră în Conferință</button>
<button id="btn-hangup" onclick="hangUp()" disabled>❌ Închide Apelul</button>

<div id="status">Status: Deconectat</div>

<audio id="audio-remote" autoplay></audio>

<!-- Am adăugat /js/ aici -->
<script src="/js/app.js"></script>

<!-- Zona pentru Dashboard (Tabelul se va genera automat aici) -->
<div id="dashboard-wrapper">
    <h2>📡 Monitorizare Live Conferință</h2>
    <div id="dashboard-container">
        <div class="empty-message">Se așteaptă datele de la server...</div>
    </div>
</div>

<!-- Scriptul AJAX care aduce datele din Java în timp real -->
<script>
        // Funcție mică care citește ce scrie în căsuță
        function getSelectedRoom() {
        return document.getElementById('room-input').value || '3000';
    }

        function updateDashboard() {
        const room = getSelectedRoom();
        // Am adăugat camera dinamic în link
        fetch('/api/participanti/' + room + '?t=' + new Date().getTime(), { cache: 'no-store' })
        .then(response => response.json())
        .then(data => {
        const container = document.getElementById('dashboard-container');
        if (data.length === 0) {
        container.innerHTML = `<div class="empty-message">Conferința ${room} este momentan goală sau inactivă.</div>`;
        return;
    }

        let html = '<table><tr><th>ID</th><th>Extensie / Caller ID</th><th>Canal</th><th>Permisiuni Audio</th><th>Acțiuni</th></tr>';
        data.forEach(p => {
        html += `<tr>
                                <td><strong>${p.id}</strong></td>
                                <td>${p.ext}</td>
                                <td>${p.channel}</td>
                                <td>${p.permissions}</td>
                                <td>
                                    <button style="padding: 5px 10px; margin: 2px;" onclick="muteUser('${p.id}')">🔇 Mute/Unmute</button>
                                    <button style="padding: 5px 10px; margin: 2px; background: darkred; color: white;" onclick="kickUser('${p.id}')">⛔ Kick</button>
                                </td>
                             </tr>`;
    });
        html += '</table>';
        container.innerHTML = html;
    }).catch(err => console.error(err));
    }

        function muteUser(id) {
        fetch('/api/mute/' + getSelectedRoom() + '/' + id, { method: 'POST' });
    }

        function kickUser(id) {
        fetch('/api/kick/' + getSelectedRoom() + '/' + id, { method: 'POST' });
    }

        updateDashboard();
        setInterval(updateDashboard, 2000);
</script>

</body>
</html>
